name: Build signed personal DMG
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signed-personal-build
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      TRELLIS_ENGINE_SDK: /Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk
      TRELLIS_SIGN_IDENTITY: ${{ vars.TRELLIS_SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          brew install zig@0.15 llvm@20 imagemagick python@3.13
          echo "/opt/homebrew/opt/python@3.13/libexec/bin" >> "$GITHUB_PATH"
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version
      - name: Import development identity into temporary keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPMENT_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$TRELLIS_SIGN_IDENTITY"
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          KEYCHAIN="$RUNNER_TEMP/trellis-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/trellis-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/trellis-signing.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/trellis-signing.p12"
      - name: Build and sign personal application
        run: ./script/package-personal.sh
      - name: Build drag-and-drop installer
        run: ./script/build-dmg.sh
      - name: Upload personal testing installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Trellis-AppleSilicon-personal
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/trellis-signing.p12"
          if [[ -f "$RUNNER_TEMP/trellis-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/trellis-signing.keychain-db"
          fi
